variables:
  GIT_SUBMODULE_STRATEGY: none
  ROOT_DIR: '$CI_PROJECT_DIR'
  APPS: "tests"
  OBJCACHE: ''
  RISCV_WARNINGS: '-Werror'
  CMAKE: 'cmake'
  CTEST: 'ctest'
  python: 'python3'
  python3: 'python3'

workflow:
  rules:
    - if: $CI_MERGE_REQUEST_ID
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_REF_NAME

before_script:
  - source util/chips-it-env.sh
  - env

stages:
  - test
  - lint

##########
#  Lint  #
##########

# Code style test
code-style:
  stage: lint
  script:
    - ./util/lint.sh

###########
#  Build  #
###########

# Runtime tests
snRuntime-test-vsim:
  stage: test
  script:
    # Update opcodes
    - make update_opcodes
    # Compile the binaries
    - cd hw/system/spatz_cluster
    - make sw.vsim SPATZ_CLUSTER_CFG=${cfg}.hjson -B
    # Run the test
    - cd sw/build/snRuntime
    - ${CTEST} --output-on-failure
  parallel:
    matrix:
      - { cfg: spatz_cluster.default.dram }
      - { cfg: spatz_cluster.smallvrf.dram }
      - { cfg: spatz_cluster.doublebw.dram }

snRuntime-test-vcs:
  stage: test
  script:
    # Update opcodes
    - make update_opcodes
    # Compile the binaries
    - cd hw/system/spatz_cluster
    - make sw.vcs SPATZ_CLUSTER_CFG=${cfg}.hjson -B
