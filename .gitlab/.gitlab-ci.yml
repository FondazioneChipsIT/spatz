variables:
  GIT_SUBMODULE_STRATEGY: none
  ROOT_DIR: '$CI_PROJECT_DIR'
  APPS: "tests"

  LLVM_INSTALL_DIR:      '/opt/riscv/spatz-14-llvm'
  GCC_INSTALL_DIR:       '/opt/riscv/spatz-gcc-7.1.1'
  BENDER_INSTALL_DIR:    '/tools/utils/bender_0.29.1'
  VERILATOR_INSTALL_DIR: '/tools/verilator/5.041'
  VERILATOR_ROOT:        '/tools/verilator/5.041/share/verilator'
  PATH: '/opt/riscv/spatz-14-llvm/bin:/opt/riscv/spatz-gcc-7.1.1/bin:/tools/utils/bender_0.29.1:/tools/verilator/5.041/bin'

  OBJCACHE: ''
  RISCV_WARNINGS: '-Werror'
  CTEST: '/usr/local/bin/ctest'
  python:  '/usr/bin/python3.8'
  python3: '/usr/bin/python3.8'


workflow:
  rules:
    - if: $CI_MERGE_REQUEST_ID
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_REF_NAME

before_script:
  - env
  - module load questa/2025.3
  - module load vcs/2024.09
  - module load verilator/5.041

stages:
  - test
  - lint

##########
#  Lint  #
##########

# Code style test
code-style:
  stage: lint
  script:
    - ./util/lint.sh

###########
#  Build  #
###########

# Runtime tests
snRuntime-test-vsim:
  stage: test
  script:
    # Download bender
    - make bender
    # Update opcodes
    - make update_opcodes
    # Download python dependencies
    - export PYTHON3=$(which python3.8)
    - ${PYTHON3} -m pip install --user jsonref
    - ${PYTHON3} -m pip install --user jsonschema
    - ${PYTHON3} -m pip install --user jstyleson
    - ${PYTHON3} -m pip install --user dataclasses
    - ${PYTHON3} -m pip install --user mako
    # Compile the binaries
    - cd hw/system/spatz_cluster
    - make sw.vsim SPATZ_CLUSTER_CFG=${cfg}.hjson -B
    # Run the test
    - cd sw/build/snRuntime
    - ${CTEST} --output-on-failure
  parallel:
    matrix:
      - { cfg: spatz_cluster.default.dram }
      - { cfg: spatz_cluster.smallvrf.dram }
      - { cfg: spatz_cluster.doublebw.dram }

