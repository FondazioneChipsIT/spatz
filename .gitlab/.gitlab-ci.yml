# RISC-V unit tests
riscvTests-test-vsim:
  stage: test
  script:
    # Update opcodes
    - make update_opcodes
    # Compile the binaries
    - cd hw/system/spatz_cluster
    - make sw.vsim SPATZ_CLUSTER_CFG=${cfg}.hjson -B
    # Run the test
    - cd sw/build/riscvTests
